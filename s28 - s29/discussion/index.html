<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JavaScript - Reactive DOM with Fetch</title>
  </head>
  <body>
    <h1>All Posts</h1>
    <button type ="button" id="delete-all-post">Delete All</button>
    <!-- We will add the post items as html elements in this div. -->
    <div id="div-post-entries"></div>

    <hr>
    <h1>View a Post</h1>
    <form id="form-view-post">
      <span>Post ID</span><br>
      <input type="number" id="txt-post-id"><br>
      <button type="submit" id="view-post-button">View</button>
      
      <div id="view-post"></div>
    </form>

    <hr>
    <h1>Add Post</h1>
    <form id="form-add-post">
      <span>Title</span><br>
      <input type="text" id="txt-title"><br>
      <span>Body</span><br>
      <textarea type="text" id="txt-body"></textarea><br>
      <button type="submit">Create</button>
    </form>

    <hr>
    <h1>Edit Post</h1>
    <form id="form-edit-post">
      <input type ="number" id = "txt-edit-id" hidden><br>
      <span>Title</span><br>
      <input type ="text" id="txt-edit-title"><br>
      <span>Body</span><br>
      <textarea type="text" id="txt-edit-body"></textarea><br>
      <button type="submit" id="btn-submit-update" disabled>Update</button>

    </form>

    <script type="text/javascript" src="./index.js"></script>
  </body>
</html>
