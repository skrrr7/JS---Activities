<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Zuitt Movie Library</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="navbar">
        <h3>Zuitt Movie Library</h3>
        <div>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </div>
    </div>
    <div class="form-container">
        <h1>Register</h1>
        <form id="registerForm">
            <div class="form-group">
                <label for="email">Email</label><br>
                <input type="email" id="email" name="email">
                <span id="emailError" class="error">Enter a valid email address.</span>
            </div>
            <div class="form-group">
                <label for="password">Password</label><br>
                <input type="password" id="password" name="password">
                <span id="passwordError" class="error">Password must be at least 8 characters.</span>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label><br>
                <input type="password" id="confirmPassword" name="confirmPassword">
                <span id="confirmPasswordError" class="error">Passwords must match.</span>
            </div>
            <button type="submit">Submit</button>
        </form>
    </div>
    <script src="index.js"></script>
</body>
</html>
